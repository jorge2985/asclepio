# CI principal de Asclepio.
#
# Corre verificaciones que no requieren proveedores externos: tests backend,
# tests/lint mobile, build backend y un escaneo basico de secretos conocidos.

name: CI - Asclepio

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asclepio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Apply test migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/asclepio_test?sslmode=disable
        run: go run ./scripts/migrate

      - name: Run Go tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asclepio_test?sslmode=disable
          JWT_SECRET: ci-test-secret-key-1234567890
          PAYMENT_PROVIDER: mock
        run: go test ./... -v -count=1

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Build backend
        working-directory: backend
        run: go build -buildvcs=false ./...

  mobile:
    name: Mobile tests and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Run Jest tests
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Run Expo lint
        working-directory: mobile
        run: npm run lint

  secret-scan:
    name: Basic secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject known leaked development secrets
        shell: bash
        run: |
          if grep -RInE '18zeta29|dev_secreto_seguro_asclepio_2026|postgres://postgres:18zeta29|192\.168\.0\.5' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude=project_status.md --exclude=project_status_detailed.md \
            --exclude=HOJA_DE_RUTA_USO_MASIVO.md .; then
            echo "Known leaked secret or local IP pattern found."
            exit 1
          fi
